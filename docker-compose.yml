services:
  fixtures_tests:
    volumes:
      - ./:/app
    build:
      context: .
    depends_on:
      - mysql
      - redis
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --sql-mode=""
    volumes:
      - ./tests/Support/Scripts:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: fixtures_tests
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
